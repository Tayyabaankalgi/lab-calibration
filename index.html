<body>

<div class="container">

    <h1>Water Activity Calibration Engine</h1>

    <div class="input-group">
        <label>Select Instrument</label>

        <select id="meterSelect">
            <option value="labmaster">Labmaster Neo</option>
            <option value="mastergreen">Master Green</option>

        </select>
    </div>

    <div class="input-group">
        <label>Raw Experimental Reading (x)</label>

        <input
            type="number"
            id="rawInput"
            step="0.001"
            placeholder="Enter raw reading"
        >
    </div>

    <div class="result-box">
        <div class="result-title">True Calibrated aw</div>
        <div class="result-value" id="resultValue">0.000</div>
    </div>

    <div class="equation-box">
        <p id="equationText">Equation will appear here</p>
    </div>

    <div class="stats-box">
        <p id="slopeText"></p>
        <p id="interceptText"></p>
    </div>

    <div class="footer-note">
        Calibration based on linear regression using Excel calibration standards.
    </div>

</div>

<script>

// =========================================================
// CALIBRATION DATA FROM EXCEL SHEET
// =========================================================
// Formula used in Excel:
// Average Experimental Reading = AVERAGE(Reading1, Reading2, Reading3)
// Linear Regression Formula:
// y = mx + c
// where:
// y = True Standard aw
// x = Experimental Meter Reading
// =========================================================

const calibrationData = {

    // =====================================================
    // LABMASTER NEO
    // =====================================================
    labmaster: {
        name: "Labmaster Neo",

        standards: [0.11, 0.33, 0.53, 0.73, 0.97],

        readings: [
            [0.1035, 0.1089, 0.1052],
            [0.3022, 0.3096, 0.3011],
            [0.4780, 0.4847, 0.4848],
            [0.6989, 0.7037, 0.7042],
            [0.9985, 0.9990, 1.0020]
        ]
    },

    // =====================================================
    // MASTER GREEN
    // =====================================================
    mastergreen: {
        name: "Master Green",

        standards: [0.11, 0.33, 0.53, 0.73, 0.97],

        readings: [
            [0.100, 0.101, 0.095],
            [0.243, 0.241, 0.240],
            [0.415, 0.411, 0.413],
            [0.654, 0.653, 0.655],
            [0.853, 0.847, 0.875]
        ]
    },

    // =====================================================
    // PORTABLE METER
    // =====================================================
    portable: {
        name: "Portable Meter",

        standards: [0.11, 0.33, 0.53, 0.73, 0.97],

        readings: [
            [0.1065, 0.0750, 0.0770],
            [0.2850, 0.2820, 0.2790],
            [0.4570, 0.4570, 0.4620],
            [0.7170, 0.7220, 0.7180],
            [0.9190, 0.9610, 0.9540]
        ]
    }
};

// =========================================================
// CALCULATE AVERAGE
// Formula:
// Average = (x1 + x2 + x3) / 3
// =========================================================

function calculateAverage(values) {

    let total = 0;

    for (let i = 0; i < values.length; i++) {
        total += values[i];
    }

    return total / values.length;
}

// =========================================================
// LINEAR REGRESSION CALCULATION
// Formula:
// m = [nΣxy - (Σx)(Σy)] / [nΣx² - (Σx)²]
// c = [Σy - mΣx] / n
// =========================================================

function calculateRegression(xValues, yValues) {

    const n = xValues.length;

    let sumX = 0;
    let sumY = 0;
    let sumXY = 0;
    let sumXX = 0;

    for (let i = 0; i < n; i++) {

        sumX += xValues[i];
        sumY += yValues[i];
        sumXY += xValues[i] * yValues[i];
        sumXX += xValues[i] * xValues[i];
    }

    const slope =
        ((n * sumXY) - (sumX * sumY)) /
        ((n * sumXX) - (sumX * sumX));

    const intercept =
        (sumY - (slope * sumX)) / n;

    return {
        slope,
        intercept
    };
}

// =========================================================
// DOM ELEMENTS
// =========================================================

const meterSelect = document.getElementById("meterSelect");
const rawInput = document.getElementById("rawInput");
const resultValue = document.getElementById("resultValue");
const equationText = document.getElementById("equationText");
const slopeText = document.getElementById("slopeText");
const interceptText = document.getElementById("interceptText");

// =========================================================
// MAIN CALCULATION ENGINE
// =========================================================

function updateCalibration() {

    const selectedMeter = meterSelect.value;
    const rawReading = parseFloat(rawInput.value);

    const meter = calibrationData[selectedMeter];

    // Calculate average experimental readings
    const experimentalAverages = meter.readings.map(readingSet => {
        return calculateAverage(readingSet);
    });

    // Regression Calculation
    const regression = calculateRegression(
        experimentalAverages,
        meter.standards
    );

    // Input Validation
    // Water activity cannot exceed 1.0000

    if (rawReading > 1) {

        resultValue.textContent = "ERROR";

        equationText.innerHTML = `
            <strong style="color:red;">Invalid Input:</strong><br>
            Water activity value cannot exceed 1.0000
        `;

        slopeText.textContent = "";
        interceptText.textContent = "";

        return;
    }

    // If user entered value
    if (!isNaN(rawReading)) {

        // Linear equation
        // y = mx + c
        const calibratedAw =
            (regression.slope * rawReading) + regression.intercept;

        resultValue.textContent = calibratedAw.toFixed(4);

        const sign = regression.intercept >= 0 ? "+" : "-";

        equationText.innerHTML = `
            <strong>Regression Equation:</strong><br>
            y = ${regression.slope.toFixed(6)}x
            ${sign}
            ${Math.abs(regression.intercept).toFixed(6)}
        `;

        slopeText.innerHTML = `
            <strong>Slope (m):</strong>
            ${regression.slope.toFixed(6)}
        `;

        interceptText.innerHTML = `
            <strong>Intercept (c):</strong>
            ${regression.intercept.toFixed(6)}
        `;

    }
    else {

        resultValue.textContent = "0.000";

        equationText.textContent =
            "Enter raw reading to start calibration.";

        slopeText.textContent = "";
        interceptText.textContent = "";
    }
}

// =========================================================
// EVENT LISTENERS
// =========================================================

meterSelect.addEventListener("change", updateCalibration);
rawInput.addEventListener("input", updateCalibration);

// =========================================================
// INITIAL LOAD
// =========================================================

updateCalibration();

</script>

</body>
</html>
